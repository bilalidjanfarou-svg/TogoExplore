<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Inscription - TogoExplore</title>
</head>

<body>

    <h1>Créer un compte</h1>

    {% if error %}
        <p style="color: red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div>
            <label>Nom d'utilisateur</label>
            <input
                type="text"
                name="username"
                required
            >
        </div>

        <br>

        <div>
            <label>Email</label>
            <input
                type="email"
                name="email"
                required
            >
        </div>

        <br>

        <div>
            <label>Mot de passe</label>
            <input
                type="password"
                name="password"
                required
            >
        </div>

        <br>

        <div>
            <label>Confirmer le mot de passe</label>
            <input
                type="password"
                name="password2"
                required
            >
        </div>

        <br>

        <button type="submit">
            S'inscrire
        </button>

    </form>

    <p>
        Vous avez déjà un compte ?
        <a href="{% url 'login' %}">
            Se connecter
        </a>
    </p>

    <p>
        <a href="{% url 'home' %}">
            Retour à l'accueil
        </a>
    </p>

</body>

</html>
