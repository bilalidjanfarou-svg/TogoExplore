<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mes favoris - TogoExplore</title>
</head>

<body>

<h1>❤️ Mes sites favoris</h1>

{% for favorite in favorite_sites %}

    <div>
        <h2>{{ favorite.site.name }}</h2>

        <p>
            {{ favorite.site.description }}
        </p>

        <a href="{% url 'site_detail' favorite.site.id %}">
            Voir le site
        </a>

        <a href="{% url 'remove_favorite' favorite.site.id %}">
            💔 Retirer
        </a>
    </div>

{% empty %}

    <p>Vous n'avez encore aucun site favori.</p>

{% endfor %}

<a href="/">
    Retour à l'accueil
</a>

</body>
</html>
